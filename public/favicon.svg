<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="4" y1="36" x2="44" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c896"/>
      <stop offset="100%" stop-color="#00e5a0"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="4" y1="36" x2="44" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c896" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00e5a0" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="32" y1="18" x2="42" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#4dffca"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="48" height="48" rx="10" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="8" y1="16" x2="40" y2="16" stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.5"/>
  <line x1="8" y1="24" x2="40" y2="24" stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.5"/>
  <line x1="8" y1="32" x2="40" y2="32" stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.5"/>

  <!-- Area fill under the chart line -->
  <path d="M8 36 L14 30 L22 33 L30 22 L38 14 L42 10 L42 40 L8 40 Z" fill="url(#fillGrad)"/>

  <!-- Main chart line with glow -->
  <polyline
    points="8,36 14,30 22,33 30,22 38,14 42,10"
    fill="none"
    stroke="url(#lineGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Arrow head at the end -->
  <polygon points="42,10 36,12 38,16" fill="url(#arrowGrad)" filter="url(#glow)"/>

  <!-- Small dot accents on data points -->
  <circle cx="14" cy="30" r="1.5" fill="#00e5a0" opacity="0.7"/>
  <circle cx="22" cy="33" r="1.5" fill="#00e5a0" opacity="0.7"/>
  <circle cx="30" cy="22" r="1.5" fill="#00e5a0" opacity="0.8"/>
  <circle cx="38" cy="14" r="1.5" fill="#00e5a0" opacity="0.9"/>
  <circle cx="42" cy="10" r="2" fill="#4dffca"/>
</svg>